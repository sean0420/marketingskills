<title>Shine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: bento of frosted widgets over a soft aurora. Header (greeting + clock) / capture / bento (stats, flow, tasks, mail). Floating pill nav. Sunrise gradient = Shine. */
:root{
  --bg:#F1F2F6; --ink:#15161C; --muted:#696C7B; --glass:rgba(255,255,255,.68); --glass-strong:rgba(255,255,255,.9);
  --stroke:rgba(255,255,255,.95); --line:rgba(21,22,40,.08); --line-2:rgba(21,22,40,.14); --fill:rgba(21,22,40,.05);
  --sun1:#FFB547; --sun2:#FF6A3D; --sun3:#FF4D8D; --accent:#FF5F45;
  --work:#3B6CFF; --work-bg:rgba(59,108,255,.12); --life:#0B9E70; --life-bg:rgba(11,158,112,.13); --danger:#E5484D; --focus:#3B6CFF;
  --blob1:#FFD2B3; --blob2:#DCD4FF; --blob3:#C5F0DD;
  --shadow:0 1px 1px rgba(21,22,40,.03),0 14px 36px -16px rgba(21,22,40,.20);
  --grad:linear-gradient(120deg,var(--sun1),var(--sun2) 52%,var(--sun3));
  --font:"Geist","IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --hour:54px; --solid:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0B0F; --ink:#F2F2F6; --muted:#9A9DAE; --glass:rgba(27,28,38,.62); --glass-strong:rgba(31,32,44,.92);
  --stroke:rgba(255,255,255,.07); --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14); --fill:rgba(255,255,255,.06);
  --work:#7E9CFF; --work-bg:rgba(126,156,255,.17); --life:#3FD8A6; --life-bg:rgba(63,216,166,.15); --danger:#FF6B70; --focus:#7E9CFF;
  --blob1:#4A2213; --blob2:#261D5C; --blob3:#0B3527; --shadow:none; --solid:#1D1E28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0B0F; --ink:#F2F2F6; --muted:#9A9DAE; --glass:rgba(27,28,38,.62); --glass-strong:rgba(31,32,44,.92);
  --stroke:rgba(255,255,255,.07); --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14); --fill:rgba(255,255,255,.06);
  --work:#7E9CFF; --work-bg:rgba(126,156,255,.17); --life:#3FD8A6; --life-bg:rgba(63,216,166,.15); --danger:#FF6B70; --focus:#7E9CFF;
  --blob1:#4A2213; --blob2:#261D5C; --blob3:#0B3527; --shadow:none; --solid:#1D1E28; color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
.aura{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(42% 38% at 6% 0%,var(--blob1),transparent 72%),radial-gradient(38% 34% at 96% 6%,var(--blob2),transparent 72%),radial-gradient(46% 40% at 62% 104%,var(--blob3),transparent 72%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.page{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding-block:max(26px,env(safe-area-inset-top,0px)) calc(108px + env(safe-area-inset-bottom,0px));
  padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:10px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--grad);display:grid;place-items:center;box-shadow:0 4px 14px -4px var(--sun2)}
.brand i svg{color:#fff}
.hello h1{margin:0;font-size:34px;line-height:1.15;font-weight:650;letter-spacing:-.035em;text-wrap:balance}
.hello p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
.hello p em{font-style:normal;color:var(--ink);font-weight:600}
.top-r{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.clock{display:flex;align-items:baseline;gap:6px;font-weight:600;letter-spacing:-.04em;line-height:1}
.clock #clock-t{font-size:48px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.clock #clock-ap{font-size:14px;letter-spacing:0;color:var(--muted);font-weight:500}
.dateline{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--fill);border-radius:999px;padding:3px;gap:2px}
.seg button{white-space:nowrap;border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.work{background:var(--work)} .dot.personal{background:var(--life)}

/* glass surfaces */
.tile,.panel,.capture,.stat,.note-card,.dialog,.tabs{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.tile,.panel{border-radius:28px;padding:20px 20px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.panel h2,.tile h2{font-size:16px;margin:0 0 8px;font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:-.02em}
.h-actions{display:flex;gap:8px;align-items:center;font-weight:400;font-size:12px;color:var(--muted)}

/* capture */
.capture{border-radius:28px;padding:10px;display:flex;flex-direction:column;gap:8px;position:relative}
.capture::before{content:"";position:absolute;inset:-1px;border-radius:29px;padding:1.5px;background:var(--grad);opacity:0;transition:opacity .2s;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.capture:focus-within::before{opacity:1}
.cap-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:0 4px 2px}
.cap-head .hint{color:var(--muted);font-size:12.5px}
.cap-head .seg button{padding:5px 12px;font-size:12.5px}
.cap-row{display:flex;gap:8px;align-items:stretch}
.field{position:relative;flex:1;min-width:0;display:flex}
.field svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);pointer-events:none}
.field input{flex:1;min-width:0;border:0;background:transparent;border-radius:20px;padding:15px 14px 15px 50px;font-size:17px}
.field input::placeholder{color:var(--muted)}
.field input:focus,.cap-row textarea:focus{outline:none}
.cap-row textarea{flex:1;min-width:0;border:0;background:var(--fill);border-radius:20px;padding:14px;min-height:150px;resize:vertical;font-size:15px}
.btn{border:1px solid var(--line-2);background:var(--glass-strong);border-radius:14px;padding:8px 14px;font-weight:500;font-size:13.5px;white-space:nowrap;color:var(--ink)}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--grad);color:#fff;border:0;font-weight:600;box-shadow:0 6px 18px -8px var(--sun2)}
.btn.primary:hover{filter:brightness(1.05)}
.cap-row > .btn.primary{padding:0 24px;border-radius:20px}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.sm{padding:4px 11px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.icon-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);background:var(--glass-strong);font-size:17px;line-height:1;display:grid;place-items:center;padding:0;color:var(--ink)}
.mic{width:52px;display:grid;place-items:center;padding:0;border-radius:20px;border:0;background:var(--fill)}
.mic[data-on="true"]{background:var(--danger);color:#fff}
.cap-col{display:flex;flex-direction:column;gap:8px}
.cap-col .btn.primary{padding:12px 18px;border-radius:18px}
.status{font-size:12.5px;color:var(--muted);padding:0 8px 4px}
.status.err{color:var(--danger)}
.status:empty,.preview:empty,#banner:empty{display:none}

/* preview */
.preview{display:flex;flex-direction:column;gap:8px;padding:0 4px 4px}
.pv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border-radius:18px;padding:10px 12px;background:var(--fill)}
.pv.work{background:var(--work-bg)} .pv.personal{background:var(--life-bg)}
.pv-fields{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.pv-fields input,.pv-fields select{border:1px solid var(--line-2);background:var(--glass-strong);border-radius:10px;padding:6px 9px;font-size:13px;min-width:0;color:var(--ink)}
.pv-fields .t{flex:1 1 240px}
.tag{font-size:11.5px;color:var(--muted);background:var(--glass-strong);border-radius:8px;padding:2px 8px}
.pv-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.pv-actions .note{margin-right:auto;font-size:12.5px;color:var(--muted)}
.pv-gcal{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;flex-basis:100%;font-size:12.5px;color:var(--muted)}
.pv-gcal label{display:flex;gap:5px;align-items:center}
.pv-gcal input[type=text]{flex:1 1 220px}
.tzline{font-size:12px;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--glass);border:1px solid var(--stroke);border-radius:18px;padding:8px 8px 8px 16px;font-size:13px}

/* bento */
.bento{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"morning morning" "stats stats" "prep prep" "flow focus" "flow tasks" "flow mail" "flow notes";gap:16px;align-items:start}
.bento.wide{grid-template-areas:"morning morning" "stats stats" "prep prep" "focus focus" "flow flow" "tasks mail" "notes notes"}
.stats{grid-area:stats;display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:16px}
.flow{grid-area:flow} .tasks{grid-area:tasks} .mail{grid-area:mail} .recent{grid-area:notes}
.stat{border-radius:24px;padding:14px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:500}
.stat b{font-size:30px;font-weight:650;letter-spacing:-.04em;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .sub{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.next b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat.alert b{color:var(--danger)}

.group-label{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:12px 0 2px;display:flex;gap:6px;align-items:center}
.group-label.overdue{color:var(--danger)}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.err-line{color:var(--danger);font-size:12.5px;padding:4px 0}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}

/* rows */
.row{display:flex;align-items:flex-start;gap:12px;padding:8px 8px;border-radius:14px}
.row:hover{background:var(--fill)}
.check{width:21px;height:21px;margin-top:0;flex:none;border-radius:50%;border:2px solid var(--line-2);background:transparent;padding:0;display:grid;place-items:center}
.row.work .check{border-color:var(--work)} .row.personal .check{border-color:var(--life)}
.row.done .check{background:var(--muted);border-color:var(--muted)}
.row.done .check::after{content:"";width:8px;height:4px;border:2px solid var(--bg);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.kind{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;min-width:44px;margin-top:1px;color:var(--muted)}
.row.work .kind{color:var(--work)} .row.personal .kind{color:var(--life)}
.row-main{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0;display:flex;flex-direction:column;gap:1px;color:var(--ink)}
.row-main .title{overflow-wrap:anywhere;font-weight:500}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.meta .late{color:var(--danger);font-weight:600}

/* flow */
.flow-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.flow-head h2{margin:0;font-size:20px;letter-spacing:-.03em}
.flow-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flow-ctl .nav{display:flex;gap:4px;align-items:center}
.allday{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px}
.allday .chip{width:auto;max-width:100%}
.tl{position:relative;margin:10px 0 6px}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hr span{position:absolute;left:0;top:-8px;font-size:11px;color:var(--muted);line-height:16px;font-variant-numeric:tabular-nums}
.tl-evts{position:absolute;left:44px;right:0;top:0;bottom:0}
.ev{position:absolute;border:0;border-radius:14px;padding:6px 10px;text-align:left;display:flex;flex-direction:column;overflow:hidden;font-size:13px;line-height:1.3;gap:1px;color:var(--ink);font-weight:500}
.ev.work{background:var(--work-bg)} .ev.personal{background:var(--life-bg)}
.ev .tm{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.ev.work .tm{color:var(--work)} .ev.personal .tm{color:var(--life)}
.ev > span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ev .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.ev.past{opacity:.45}
.ev.short{flex-direction:row;gap:6px;align-items:center;white-space:nowrap}
.nowline{position:absolute;right:0;height:0;z-index:2;pointer-events:none;border-top:2px solid var(--sun2)}
.tl > .nowline{left:38px}
.nowline::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 5px color-mix(in srgb,var(--sun2) 22%,transparent)}
.nowline span{position:absolute;right:0;top:-22px;font-size:11px;font-weight:600;color:#fff;background:var(--grad);border-radius:8px;padding:1px 7px;font-variant-numeric:tabular-nums}
.tl-empty{position:absolute;left:52px;right:0;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;text-align:center}

/* week grid */
.wk{display:flex;flex-direction:column}
.wk-row{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:0 4px}
.wk-dh{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 8px;color:var(--muted);font-size:12px;border-radius:14px}
.wk-dh b{font-size:18px;font-weight:600;color:var(--ink);width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.wk-dh.today b{background:var(--grad);color:#fff}
.wk-dh:hover{background:var(--fill)}
.wk-ad{display:flex;flex-direction:column;gap:3px;padding-bottom:6px;min-width:0}
.wk-gut{font-size:11px;color:var(--muted);padding-top:4px}
.wk-body{position:relative;margin-top:8px}
.wk-cols{position:absolute;left:48px;right:0;top:0;bottom:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk-col{position:relative;border-radius:12px}
.wk-col.today{background:color-mix(in srgb,var(--sun1) 9%,transparent)}
.wk-col .ev{padding:4px 6px;font-size:11.5px;border-radius:10px}
.wk-col .ev .tm{font-size:10.5px}
.wk-col .nowline{left:0}
.wk-col .nowline span{display:none}

/* month */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .wd{font-size:12px;color:var(--muted);padding:2px 8px 6px}
.mcell{min-height:104px;border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;background:var(--fill);border:0;text-align:left;color:var(--ink)}
.mcell:hover{background:var(--line-2)}
.mcell.out{background:transparent} .mcell.out .mnum{opacity:.4}
.mnum{font-size:12.5px;font-weight:600;padding:1px 6px;align-self:flex-start;font-variant-numeric:tabular-nums;border-radius:8px}
.mcell.today .mnum{background:var(--grad);color:#fff}
.more{font-size:11.5px;color:var(--muted);padding-left:4px}
.chip{border:0;text-align:left;font-size:12.5px;border-radius:9px;padding:5px 8px;display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:500}
.chip.work{background:var(--work-bg)} .chip.personal{background:var(--life-bg)}
.chip.task{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.chip.task.work{box-shadow:inset 0 0 0 1.5px var(--work)} .chip.task.personal{box-shadow:inset 0 0 0 1.5px var(--life)}
.chip.done{opacity:.5;text-decoration:line-through}
.gtag{color:var(--work);font-weight:600}
.att{display:flex;flex-wrap:wrap;gap:6px}
.att span{font-size:12px;background:var(--fill);border-radius:8px;padding:2px 8px}
.att span.ok{box-shadow:inset 0 0 0 1px var(--life)}
.att span.no{text-decoration:line-through;color:var(--muted)}
.gdesc{white-space:pre-wrap;font-size:13px;color:var(--muted);max-height:160px;overflow:auto;background:var(--fill);border-radius:12px;padding:10px 12px;margin:0}
.chip.hi::before{content:"★ ";color:var(--sun2)}
.chip .tm{font-size:11px;font-weight:600;margin-right:5px;font-variant-numeric:tabular-nums}
.mcell .chip{font-size:11.5px;padding:3px 6px}
.agenda{display:flex;flex-direction:column;gap:6px}
.ag-day{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;align-items:start;padding:8px 10px;border-radius:16px;background:var(--fill)}
.ag-day.today{background:color-mix(in srgb,var(--sun1) 16%,transparent)}
.ag-h{border:0;background:transparent;padding:2px 0 0;text-align:left;color:var(--muted);font-size:12px;line-height:1.3}
.ag-h b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.ag-items{display:flex;flex-direction:column;gap:4px;min-width:0}
.ag-none{font-size:12px;color:var(--muted);padding-top:4px}
.raw{font-size:12px;color:var(--muted)}

/* mail */
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:start;padding:10px 4px;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.mrow-main b{font-weight:550;overflow-wrap:anywhere}
.mrow-act{grid-column:2;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.mtag{font-size:11px;font-weight:600;border-radius:7px;padding:1px 7px;background:var(--fill);color:var(--muted);margin-top:2px}
.mtag.high{background:var(--grad);color:#fff}
.mtag.lo{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.mrow.mp-low .mrow-main b{font-weight:450;color:var(--muted)}
.mail details{font-size:12.5px;color:var(--muted);margin-top:8px}
.mail details summary{cursor:pointer}
.mail .set-row{display:flex;gap:6px;margin-top:6px}
.mail .set-row input{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--glass-strong);border-radius:10px;padding:6px 9px}

/* notes */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.note-card{border-radius:24px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;color:var(--ink)}
.note-card strong{font-weight:600}
.note-card p{margin:0;color:var(--muted);font-size:13px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}

/* floating nav */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--glass-strong);box-shadow:0 14px 40px -12px rgba(0,0,0,.35)}
.tabs a{display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:550;font-size:14px;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tabs .count{font-size:12px;opacity:.75}

/* dialog */

  } catch (e) {

    const ts = await gmailThreads(INBOX_Q, 25);
    S.mailLive = Date.now(); pollDelay = POLL_MS; if (S.mailErr) { S.mailErr = ''; }
    if (!S.mail.seen) { await Store.saveMail({ seen: Object.fromEntries(ts.map(t => [t.id, t.mid])) }); return; }
    const me = S.mail.me || '', skip = new Set(S.mail.dismissed || []);

    if (me) { const answered = new Set(ts.filter(t => t.from === me).map(t => t.id)); const n0 = results.length; results = results.filter(r => !(answered.has(r.id) && r.kind !== 'followup')); changed = results.length !== n0; }
    const fresh = ts.filter(t => S.mail.seen[t.id] !== t.mid && !skip.has(t.id) && t.from !== me);
    const seen = { ...S.mail.seen }; ts.forEach(t => { seen[t.id] = t.mid; });

      const ids = new Set(fresh.map(t => t.id));

    else renderMailOnly();

    const c = e && e.code;
    if (['server_not_connected','needs_reauth','not_in_manifest','blocked_by_policy','not_granted','capability_disabled','selection_required'].includes(c)) { pollStopped = true; S.mailErr = mailErrText(e); renderMailOnly(); }
    else pollDelay = Math.min(120000, Math.max(30000, (e && e.retryAfterMs) || 0, pollDelay * 2));

}

    case 'ent-sum': entSummary(findEntity(S.entSel)); break;
    case 'morning-ok': ls.set('hub.morningSeen', ymd(today0())); render(); break;
    case 'mail-draft': startDraft(el.dataset.tid); break;
    case 'dr-retry': if (S.draft) startDraft(S.draft.tid); break;
    case 'dr-save': saveDraft(); break;
    case 'prep-brief': { const x = prepTarget(); if (x && x.i.id === id) { delete S.briefs[briefId(x.i)]; S.briefs[briefId(x.i)] = null; makeBrief(x.i); } break; }
    case 'gc-prep': { const ev = (S.gcal.events || []).find(x => x.id === openId); if (ev) { await Store.add({ type: 'task', title: `${ev.title} 준비`, area: 'work', date: ev.date, time: null, endTime: null, status: 'open', priority: 'normal', people: [], org: null, notes: ev.gev.link ? `Google 캘린더: ${ev.gev.link}` : '', source: 'Google 캘린더', raw: '', links: [] }); closeDialog(); setStatus(`"${ev.title} 준비"를 할 일에 추가했어요.`); } break; }
    case 'cf-no': { if (el.classList.contains('overlay') && e.target !== el) return; const P = pendingDelete; pendingDelete = null; renderConfirm(); if (P && P.onNo) P.onNo(); break; }
    case 'cf-yes': { const P = pendingDelete; pendingDelete = null; renderConfirm(); if (P && P.onYes) P.onYes(); break; }
    case 'undo-del': { const it = lastDeleted; lastDeleted = null; clearTimeout(toastTimer); $('#toast-root').innerHTML = ''; if (it) await Store.unarchive(it.id); break; }
    case 'ar-restore': { const it = S.trash.find(x => x.id === id); if (it) { await Store.unarchive(id); setStatus(`"${it.title}"을(를) 복원했어요.`); } break; }
    case 'ar-purge': { const it = S.trash.find(x => x.id === id); if (it) askConfirm({ icon: 'trash', title: '영구 삭제할까요?', body: `"${it.title}"은(는) 되돌릴 수 없어요.`, yes: '영구 삭제', onYes: () => Store.remove(id) }); break; }
    case 'ar-empty': askConfirm({ icon: 'trash', title: '보관함을 비울까요?', body: `${S.trash.length}개 항목이 영구 삭제되고 되돌릴 수 없어요.`, yes: '모두 삭제', onYes: async () => { for (const it of [...S.trash]) await Store.remove(it.id); } }); break;
    case 'star': { const it = S.items.find(x => x.id === id); if (it) Store.update(id, { priority: it.priority === 'high' ? 'normal' : 'high' }); break; }
    case 'pv-commit': commitPreview(); break;
    case 'pv-cancel': parseSeq++; S.preview = null; renderPreview(); setStatus(''); break;
    case 'cal-prev': S.calAnchor = S.calMode==='week' ? addDays(S.calAnchor,-7) : new Date(S.calAnchor.getFullYear(), S.calAnchor.getMonth()-1, 1); render(); break;
    case 'cal-next': S.calAnchor = S.calMode==='week' ? addDays(S.calAnchor,7) : new Date(S.calAnchor.getFullYear(), S.calAnchor.getMonth()+1, 1); render(); break;
    case 'cal-today': S.calAnchor = today0(); render(); break;
    case 'flow-mode': S.flowMode = el.dataset.v; ls.set('hub.flowMode', S.flowMode); render(); ensureGcal(); break;
    case 'flow-today': S.flowDate = today0(); render(); ensureGcal(); break;
    case 'flow-prev': case 'flow-next': { const k = act === 'flow-prev' ? -1 : 1, D = S.flowDate;
      S.flowDate = S.flowMode === 'day' ? addDays(D, k) : S.flowMode === 'week' ? addDays(D, 7*k) : new Date(D.getFullYear(), D.getMonth() + k, 1); render(); ensureGcal(); break; }
    case 'flow-day': S.flowDate = fromYmd(el.dataset.d); S.flowMode = 'day'; ls.set('hub.flowMode', 'day'); render(); ensureGcal(); break;
    case 'cal-day': S.calAnchor = fromYmd(el.dataset.d); S.calMode = 'week'; ls.set('hub.calMode', 'week'); render(); break;
    case 'cal-mode': S.calMode = el.dataset.v; ls.set('hub.calMode', S.calMode); render(); break;
    case 'toggle-done': S.showDone = !S.showDone; render(); break;
    case 'dlg-bg': if (openId && openId.startsWith('d:') && S.draft && (dlgDirty || S.draft.loading || S.draft.saving)) break; closeDialog(); break;
    case 'dlg-close': closeDialog(); break;
    case 'dlg-save': saveDialog(); break;
    case 'dlg-done': await toggleDone(openId); closeDialog(); break;
    case 'del': confirmDel = true; renderDialog(); break;
    case 'del-no': confirmDel = false; renderDialog(); break;
    case 'del-yes': { const it = S.items.find(y => y.id === openId); closeDialog(); if (it) await doDelete(it); break; }
    case 'mail-check': pollStopped = false; checkMail(false); break;
    case 'sync-now': refreshNow(true); setStatus('최신 상태로 새로 고쳤어요.'); setTimeout(() => setStatus(''), 2500); break;
    case 'mail-task': el.disabled = true; mailToTask(el.dataset.tid); break;
    case 'mail-skip': mailSkip(el.dataset.tid); break;
    case 'mail-more': S.mailMore = !S.mailMore; render(); break;
    case 'save-pemail': { const v = document.getElementById('set-pemail').value.trim(); await Store.saveMail({ personalEmail: v }); setStatus(v ? '개인 메일 주소를 저장했어요.' : '개인 메일 주소를 지웠어요.'); break; }
    case 'gc-ask': {
      S.gcDraft = { att: document.getElementById('f-att').value, meet: document.getElementById('f-meet').checked };
      await saveDialog(false); S.gcConfirm = true; S.gcErr = ''; renderDialog(); break; }
    case 'gc-no': S.gcConfirm = false; renderDialog(); break;
    case 'gc-go': {
      const it = S.items.find(x => x.id === openId); if (!it || S.gcBusy) break;
      if (!it.date || !it.time) { S.gcConfirm = false; S.gcErr = '날짜와 시간을 넣고 저장한 뒤 만들어주세요.'; renderDialog(); break; }
      S.gcBusy = true; renderDialog();
      const r = await createGcal(it.id, it, S.gcDraft.att.match(EMAIL_RE) || [], S.gcDraft.meet);
      S.gcBusy = false; S.gcConfirm = false;
      if (r.ok) { S.gcDraft = null; setStatus(r.text); } else S.gcErr = r.text;
      renderDialog(); break; }
    case 'clear-examples': el.disabled = true; for (const it of S.items.filter(i => i.example)) await Store.remove(it.id); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && pendingDelete) { const P = pendingDelete; pendingDelete = null; renderConfirm(); if (P.onNo) P.onNo(); return; }
  if (e.key === 'Escape' && openId) { closeDialog(); return; }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); (S.mode==='line' ? $('#quick') : $('#meeting')).focus(); }
});
document.addEventListener('input', e => { if (e.target && e.target.id === 'ent-q') { S.entQ = e.target.value; const box = document.getElementById('ent-items'); if (box) box.innerHTML = entListHtml(entFilter(entityIndex())); } });
$('#quick').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  e.preventDefault();
  const text = $('#quick').value.trim();
  if (S.preview && S.preview.kind === 'line' && S.preview.raw === text) commitPreview(); else runQuick();
});
$('#preview').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing && e.target.matches('input:not([type=checkbox])')) { e.preventDefault(); commitPreview(); }
});
$('#quick-go').addEventListener('click', () => {
  const text = $('#quick').value.trim();
  if (S.preview && S.preview.kind === 'line' && S.preview.raw === text) commitPreview(); else runQuick();
});
$('#quick').addEventListener('input', () => {
  const p = S.preview; $('#quick-go').textContent = p && p.kind === 'line' && p.raw === $('#quick').value.trim() ? '등록' : '해석';
});
$('#meet-go').addEventListener('click', runMeeting);
function setMode(m){
  S.mode = m; S.preview = null; renderPreview(); setStatus('');
  document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  $('#line-row').hidden = m !== 'line'; $('#meet-row').hidden = m !== 'meeting';
  $('#cap-hint').textContent = m === 'line' ? '예: 다음주 수요일 OOO에게 이메일 전달 · 화요일 한국시간 오후 2시 CJ ENM 화상 미팅' : '메모를 붙여넣으면 요약, 후속 액션, 다음 미팅을 뽑아줘요';
  (m === 'line' ? $('#quick') : $('#meeting')).focus();
}
function route(){ let h = (location.hash || '#today').slice(1); if (h === 'calendar') { h = 'today'; if (S.flowMode === 'day') S.flowMode = 'week'; } S.tab = ['today','tasks','notes','archive','people'].includes(h) ? h : 'today'; render(); }
window.matchMedia('(max-width:699px)').addEventListener('change', () => render());
window.addEventListener('hashchange', route);
const origRender = render;

/* ---------- dictation ---------- */
function wireDictation(){
  let target = null;
  const btns = [$('#mic-line'), $('#mic-meet')];
  btns.forEach(b => b.hidden = false);
  dictation.onFinal(({ text }) => {
    if (!target) return;
    target.value = target.value ? target.value + text : text.replace(/^\s+/, '');
    if (target.id === 'quick') $('#quick').dispatchEvent(new Event('input'));
  });
  dictation.onPartial(({ text }) => { if (target) setStatus(text ? '듣는 중: ' + text : '듣는 중…'); });
  dictation.onState(({ state, reason }) => {
    const on = state !== 'idle';
    btns.forEach(b => b.dataset.on = String(on));
    if (on) setStatus('듣는 중… 다시 누르면 멈춰요.');
    else { setStatus(reason === 'not_granted' ? '마이크 사용이 허용되지 않았어요.' : ''); }
  });
  btns.forEach(b => b.addEventListener('click', () => {
    if (dictation.active()) { dictation.stop(); return; }
    target = b.id === 'mic-line' ? $('#quick') : $('#meeting');
    dictation.start({ language: 'ko' }).catch(err => {
      if (err && err.code === 'not_granted') btns.forEach(x => x.hidden = true);
      else if (err && err.code !== 'stopped') setStatus('음성 입력을 시작하지 못했어요.', true);
    });
  }));
}

/* ---------- swipe to delete ---------- */
var sw = null; let suppressClick = false, toastTimer = null, lastDeleted = null, pendingDelete = null;
document.addEventListener('pointerdown', e => {
  const w = e.target.closest('.swipe'); if (!w || (e.pointerType === 'mouse' && e.button !== 0)) return;
  sw = { w, row: w.querySelector('.row'), x: e.clientX, y: e.clientY, dx: 0, mode: null, pid: e.pointerId, id: w.dataset.swipe };
});
document.addEventListener('pointermove', e => {
  if (!sw || e.pointerId !== sw.pid) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.mode) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    sw.mode = dx < 0 && Math.abs(dx) > Math.abs(dy) * 1.2 ? 'swipe' : 'none';
    if (sw.mode === 'swipe') { sw.w.classList.add('active'); try { sw.w.setPointerCapture(e.pointerId); } catch {} }
    else { sw = null; return; }
  }
  sw.dx = Math.min(0, dx);
  sw.row.style.transform = `translateX(${sw.dx}px)`;
  sw.w.classList.toggle('armed', -sw.dx > Math.min(140, sw.w.offsetWidth * 0.35));
});
function endSwipe(e){
  if (!sw || (e && e.pointerId !== sw.pid)) return;
  const s = sw; sw = null;
  if (s.mode !== 'swipe') return;
  if (renderQueued) { renderQueued = false; setTimeout(render, 260); }
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
  if (s.w.classList.contains('armed') && e.type === 'pointerup') swipeDelete(s);
  else snapBack(s.w);
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);
document.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);
function snapBack(w){ const r = w.querySelector('.row'); if (r) r.style.transform = ''; w.classList.remove('armed'); setTimeout(() => w.classList.remove('active'), 240); }
function swipeDelete(s){
  const it = S.items.find(x => x.id === s.id); if (!it) { snapBack(s.w); return; }
  if (it.priority === 'high') { askConfirm({ title: '중요한 항목이에요', body: `"${it.title}"을(를) 정말 삭제할까요? 보관함에 30일 동안 남아요.`, onYes: () => animateOut(s.w, () => doDelete(it)), onNo: () => snapBack(s.w) }); return; }
  animateOut(s.w, () => doDelete(it));
}
function animateOut(w, done){
  const r = w.querySelector('.row'); r.style.transition = 'transform .2s ease'; r.style.transform = 'translateX(-110%)';
  setTimeout(() => { w.style.height = w.offsetHeight + 'px'; w.classList.add('gone'); requestAnimationFrame(() => { w.style.height = '0px'; w.style.opacity = '0'; }); setTimeout(done, 200); }, 180);
}
async function doDelete(it){
  lastDeleted = { ...it };
  await Store.archive(it.id);
  showToast(`"${it.title.length > 16 ? it.title.slice(0, 16) + '…' : it.title}" 보관함으로 옮겼어요`);
}
function showToast(msg){
  clearTimeout(toastTimer);
  $('#toast-root').innerHTML = `<div class="toast"><span>${esc(msg)}</span><button data-act="undo-del">되돌리기</button></div>`;
  toastTimer = setTimeout(() => { $('#toast-root').innerHTML = ''; lastDeleted = null; }, 5000);
}
function askConfirm(opts){ pendingDelete = opts; renderConfirm(); }
function renderConfirm(){
  const root = $('#confirm-root'); const P = pendingDelete;
  if (!P) { root.innerHTML = ''; return; }
  const icon = P.icon === 'trash'
    ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'
    : '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
  root.innerHTML = `<div class="overlay center" data-act="cf-no"><div class="dialog confirm" role="alertdialog" aria-modal="true" aria-labelledby="cf-h">
    <div class="ico">${icon}</div>
    <h3 id="cf-h">${esc(P.title)}</h3>
    <p>${esc(P.body)}</p>
    <div class="dlg-actions"><button class="btn" data-act="cf-no">취소</button><button class="btn danger-solid" data-act="cf-yes">${esc(P.yes || '삭제')}</button></div>
  </div></div>`;
  setTimeout(() => { const b = root.querySelector('[data-act="cf-no"].btn'); b && b.focus(); }, 0);
}

/* ---------- boot ---------- */
setMode('line'); $('#quick').blur();
setInterval(tick, 20000);
document.getElementById('dlg-root').addEventListener('input', () => { dlgDirty = true; });
function liveText(){
  const el = $('#live'); if (!el) return;
  const st = navigator.onLine === false ? 'off' : S.sync.state;
  el.className = 'live ' + (st === 'on' ? 'on' : st === 'off' ? 'off' : st === 'local' ? '' : 'wait');
  const ago = S.sync.at ? Math.floor((Date.now() - S.sync.at.getTime()) / 60000) : null;
  $('#live-t').textContent = st === 'off' ? '오프라인' : st === 'local' ? '이 기기에만 저장' : st === 'wait' ? '연결 중' : '실시간';
  el.title = (ago == null ? '아직 동기화 전' : ago < 1 ? '방금 동기화됨' : `${ago}분 전 동기화`) + ' · 눌러서 지금 새로 고침';
}
const MAIL_EVERY = 60 * 60000;
function mailStale(){ const at = S.mail.checkedAt ? Date.parse(S.mail.checkedAt) : 0; const h = new Date().getHours(); return Date.now() - at > MAIL_EVERY && h >= 7 && h < 21; }
function refreshNow(manual){
  if (S.flowDate && ymd(S.flowDate) !== ymd(today0()) && !manual && S.flowMode === 'day' && tick.day !== ymd(today0())) S.flowDate = today0();
  tick(); render(); liveText();
  if (S.mailLoaded && mcp && sample && (manual ? false : mailStale())) checkMail(true);
}
setInterval(() => { if (document.visibilityState === 'visible') syncGcal(); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { syncGcal(); refreshNow(false); pollDelay = POLL_MS; schedulePoll(); setTimeout(pollMail, 500); } });
window.addEventListener('focus', () => refreshNow(false));
window.addEventListener('online', () => { liveText(); refreshNow(false); });
window.addEventListener('offline', liveText);
setInterval(() => { liveText(); if (document.visibilityState === 'visible' && S.mailLoaded && mcp && sample && !S.mailBusy && mailStale()) checkMail(true); }, 5 * 60000);
setInterval(liveText, 30000);
route();
Store.init();
(async () => {
  const cl = window.claude; if (!cl || !cl.use) { S.aiReady = false; return; }
  const [s, d, m] = await Promise.all([cl.use('sample'), cl.use('dictation'), cl.use('mcp')]);
  sample = s; S.aiReady = !!s; mcp = m; syncGcal();
  if (d) { dictation = d; wireDictation(); }
  render(); maybeAutoMail(); schedulePoll();
})();
})();
</script>
